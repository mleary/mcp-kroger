# Deploys the Worker to Cloudflare on every push to main (or manually).
#
# wrangler.toml is gitignored, so it's generated here from wrangler.toml.example
# using repo secrets. Worker secrets (KROGER_CLIENT_SECRET etc.) live in
# Cloudflare via `wrangler secret put` and are not touched by deploys.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN     "Edit Cloudflare Workers" API token
#   CLOUDFLARE_ACCOUNT_ID    from `wrangler whoami`
#   TOKEN_STORE_KV_ID        KV namespace ID for TOKEN_STORE
#   OAUTH_KV_ID              KV namespace ID for OAUTH_KV
#   KROGER_STORE_ID
#   ALLOWED_GITHUB_USERNAME
#   PUBLIC_BASE_URL          e.g. https://mcp-kroger.<account>.workers.dev
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - name: Generate wrangler.toml
        env:
          TOKEN_STORE_KV_ID: ${{ secrets.TOKEN_STORE_KV_ID }}
          OAUTH_KV_ID: ${{ secrets.OAUTH_KV_ID }}
          KROGER_STORE_ID: ${{ secrets.KROGER_STORE_ID }}
          ALLOWED_GITHUB_USERNAME: ${{ secrets.ALLOWED_GITHUB_USERNAME }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        shell: python
        run: |
          import os, re, sys

          replacements = {
              "YOUR_TOKEN_STORE_KV_ID": "TOKEN_STORE_KV_ID",
              "YOUR_OAUTH_KV_ID": "OAUTH_KV_ID",
              "REPLACE_WITH_YOUR_KROGER_STORE_ID": "KROGER_STORE_ID",
              "REPLACE_WITH_YOUR_GITHUB_USERNAME": "ALLOWED_GITHUB_USERNAME",
              "https://mcp-kroger.REPLACE_WITH_YOUR_ACCOUNT.workers.dev": "PUBLIC_BASE_URL",
          }

          missing = [env for env in replacements.values() if not os.environ.get(env)]
          if missing:
              sys.exit(f"Missing repo secrets: {', '.join(missing)}")

          text = open("wrangler.toml.example").read()
          for placeholder, env in replacements.items():
              text = text.replace(placeholder, os.environ[env])

          leftover = re.findall(r"\b(?:YOUR|REPLACE_WITH)_[A-Z_]+", text)
          if leftover:
              sys.exit(f"Unfilled placeholders in wrangler.toml: {', '.join(set(leftover))}")

          open("wrangler.toml", "w").write(text)

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
